<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nuez</title>
    <meta name="description" content="Recreación de la Nuez de Plants vs Zombies">
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
</head>
<body>
    <a-scene background="color: #87CEEB">
        <a-entity position="0 1.6 4">
            <a-camera look-controls wasd-controls="acceleration:100; fly:true"></a-camera>
        </a-entity>

        <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
        <a-light type="directional" color="#fff" intensity="0.8" position="2 4 3"></a-light>
        <a-light type="point" color="#fff" intensity="0.5" position="-2 2 2"></a-light>

        <!-- CUERPO PRINCIPAL DE LA NUEZ -->
        <a-entity id="nuez" position="0 1.5 0">
            
            <!-- Cuerpo principal - esfera achatada -->
            <a-sphere 
                position="0 0 0" 
                radius="1" 
                scale="1 1.1 0.95"
                color="#B8924F"
                shadow="cast: true">
            </a-sphere>
            
            <!-- OJO IZQUIERDO -->
            <a-entity position="-0.3 0.2 0.85">
                <!-- Blanco del ojo -->
                <a-sphere 
                    radius="0.25" 
                    color="#FFFFFF">
                </a-sphere>
                <!-- Pupila negra -->
                <a-sphere 
                    position="0 0 0.2" 
                    radius="0.09" 
                    color="#000000">
                </a-sphere>
            </a-entity>

            <!-- OJO DERECHO -->
            <a-entity position="0.3 0.2 0.85">
                <!-- Blanco del ojo -->
                <a-sphere 
                    radius="0.25" 
                    color="#FFFFFF">
                </a-sphere>
                <!-- Pupila negra -->
                <a-sphere 
                    position="0 0 0.2" 
                    radius="0.09" 
                    color="#000000">
                </a-sphere>
            </a-entity>
            
            <!-- Cejas -->
            <a-box 
                position="-0.3 0.5 0.8" 
                width="0.3" 
                height="0.05" 
                depth="0.05"
                color="#654321"
                rotation="0 0 -10">
            </a-box>
            <a-box 
                position="0.3 0.5 0.8" 
                width="0.3" 
                height="0.05" 
                depth="0.05"
                color="#654321"
                rotation="0 0 10">
            </a-box>

            <!-- BOCA/SONRISA FELIZ -->
            <a-entity position="0 -0.25 0.92">
                <!-- Sonrisa feliz hacia arriba -->
                <a-torus 
                    radius="0.18" 
                    radius-tubular="0.025" 
                    color="#000000"
                    arc="100"
                    rotation="180 0 0">
                </a-torus>
                <a-torus 
                    radius="0.18" 
                    radius-tubular="0.025" 
                    color="#000000"
                    arc="100"
                    rotation="180 180 0">
                </a-torus>
            </a-entity>
            
        </a-entity>

        <a-plane 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            color="#7BC043"
            shadow="receive: true">
        </a-plane>

        <a-sky color="#87CEEB"></a-sky>

    </a-scene>
</body>
</html>
