<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Girasol</title>
    <meta name="description" content="Recreación del Girasol de Plants vs Zombies">
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
</head>
<body>
    <a-scene background="color: #87CEEB">
        <a-entity position="0 1.6 4">
            <a-camera look-controls wasd-controls="acceleration:100; fly:true"></a-camera>
        </a-entity>

        <a-light type="ambient" color="#fff" intensity="0.6"></a-light>
        <a-light type="directional" color="#fff" intensity="0.8" position="2 4 3"></a-light>
        <a-light type="point" color="#fff" intensity="0.5" position="-2 2 2"></a-light>

        <!-- GIRASOL -->
        <a-entity id="sunflower" position="0 1.2 0">
            
            <!-- CABEZA -->
            <a-entity id="cabeza" position="0 1 0">
                <!-- Centro marrón de la flor -->
                <a-sphere 
                    radius="0.4" 
                    color="#8B5A2B"
                    shadow="cast: true">
                </a-sphere>
                
                <!-- Pétalos amarillos -->
                <!-- Pétalo arriba -->
                <a-sphere 
                    position="0 0.5 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo arriba-derecha 1 -->
                <a-sphere 
                    position="0.25 0.43 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo arriba-derecha 2 -->
                <a-sphere 
                    position="0.43 0.25 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo derecha -->
                <a-sphere 
                    position="0.5 0 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo abajo-derecha 1 -->
                <a-sphere 
                    position="0.43 -0.25 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo abajo-derecha 2 -->
                <a-sphere 
                    position="0.25 -0.43 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo abajo -->
                <a-sphere 
                    position="0 -0.5 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo abajo-izquierda 1 -->
                <a-sphere 
                    position="-0.25 -0.43 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo abajo-izquierda 2 -->
                <a-sphere 
                    position="-0.43 -0.25 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo izquierda -->
                <a-sphere 
                    position="-0.5 0 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo arriba-izquierda 1 -->
                <a-sphere 
                    position="-0.43 0.25 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Pétalo arriba-izquierda 2 -->
                <a-sphere 
                    position="-0.25 0.43 0" 
                    radius="0.18" 
                    color="#F0C050">
                </a-sphere>
                
                <!-- Ojos -->
                <!-- Ojo izquierdo -->
                <a-entity position="-0.12 0.08 0.35">
                    <a-sphere 
                        radius="0.1" 
                        color="#FFFFFF">
                    </a-sphere>
                    <a-sphere 
                        position="0 0 0.08" 
                        radius="0.05" 
                        color="#000000">
                    </a-sphere>
                </a-entity>
                
                <!-- Ojo derecho -->
                <a-entity position="0.12 0.08 0.35">
                    <a-sphere 
                        radius="0.1" 
                        color="#FFFFFF">
                    </a-sphere>
                    <a-sphere 
                        position="0 0 0.08" 
                        radius="0.05" 
                        color="#000000">
                    </a-sphere>
                </a-entity>
                
                <!-- Sonrisa -->
                <a-torus 
                    position="0 -0.15 0.38" 
                    radius="0.06" 
                    radius-tubular="0.012"
                    rotation="180 0 0"
                    arc="100"
                    color="#000000">
                </a-torus>
                <a-torus 
                    position="0 -0.15 0.38" 
                    radius="0.06" 
                    radius-tubular="0.012"
                    rotation="180 180 0"
                    arc="100"
                    color="#000000">
                </a-torus>
                
                <!-- Mejillas rosadas -->
                <a-sphere 
                    position="-0.25 -0.05 0.3" 
                    radius="0.06" 
                    color="#FFB6C1"
                    opacity="0.7">
                </a-sphere>
                <a-sphere 
                    position="0.25 -0.05 0.3" 
                    radius="0.06" 
                    color="#FFB6C1"
                    opacity="0.7">
                </a-sphere>
            </a-entity>
            
            <!-- TALLO -->
            <a-cylinder 
                position="0 0.5 0" 
                radius="0.08" 
                height="1"
                color="#6B9E3E"
                shadow="cast: true">
            </a-cylinder>
            
            <!-- HOJAS BASE -->
            <!-- Hoja izquierda -->
            <a-entity position="-0.2 0.15 0" rotation="0 0 -50">
                <a-sphere 
                    radius="0.2" 
                    color="#6B9E3E"
                    scale="2 1 0.3">
                </a-sphere>
            </a-entity>
            
            <!-- Hoja derecha -->
            <a-entity position="0.2 0.15 0" rotation="0 0 50">
                <a-sphere 
                    radius="0.2" 
                    color="#6B9E3E"
                    scale="2 1 0.3">
                </a-sphere>
            </a-entity>

        </a-entity>

        <a-plane 
            position="0 0 0" 
            rotation="-90 0 0" 
            width="10" 
            height="10" 
            color="#7BC043"
            shadow="receive: true">
        </a-plane>

        <a-sky color="#87CEEB"></a-sky>

    </a-scene>
</body>
</html>
