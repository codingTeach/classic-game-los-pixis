<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script>
        // Spawn de zombies cada 5 segundos
        let score = 0;

    // Componente para que el zombie camine desde el arbusto
    AFRAME.registerComponent('zombie-logic', {
        init: function () {
            this.el.addEventListener('click', () => {
                score += 10;
                document.querySelector('#scoreText').setAttribute('value', 'Puntaje: ' + score);
                this.el.parentNode.removeChild(this.el); // El zombie muere
            });
        },
        tick: function () {
            // Movimiento hacia la casa (eje Z positivo)
            let pos = this.el.getAttribute('position');
            pos.z += 0.02; 
            this.el.setAttribute('position', pos);
        }
    });

    // Spawn automático desde el arbusto (-30 es la posición de tu arbusto)
    setInterval(() => {
        const scene = document.querySelector('a-scene');
        const zombieTemplates = ['#zombie-normal', '#zombie-cono', '#zombie-cubeta'];
        const randomId = zombieTemplates[Math.floor(Math.random() * zombieTemplates.length)];
        const original = document.querySelector(randomId);
        
        if(original) {
            const clone = original.cloneNode(true);
            clone.setAttribute('position', {x: (Math.random() * 4 - 2), y: -0.5, z: -25});
            clone.setAttribute('zombie-logic', '');
            clone.setAttribute('class', 'zombie-target');
            clone.setAttribute('visible', 'true');
            scene.appendChild(clone);
        }
    }, 5000);
    </script>

    <script>
        // REGISTRAR COMPONENTES ANTES DE QUE LA ESCENA CARGUE
        AFRAME.registerComponent('plant-tile', {
            init: function() {
                this.el.addEventListener('click', () => {
                    if (!GameState.selectedPlant) {
                        return; // No hacer nada si no hay planta seleccionada
                    }

                    const row = this.el.dataset.row;
                    const col = this.el.dataset.col;
                    const tileKey = `${row}-${col}`;

                    // Verificar si ya hay una planta en este tile
                    if (GameState.plantedTiles[tileKey]) {
                        console.log('Ya hay una planta aquí');
                        return;
                    }

                    // Verificar si hay suficientes soles
                    if (GameState.sunPoints < GameState.selectedCost) {
                        console.log('No tienes suficientes soles');
                        return;
                    }

                    // Plantar la planta
                    plantPlant(this.el, GameState.selectedPlant, tileKey);
                    
                    // Restar soles
                    GameState.sunPoints -= GameState.selectedCost;
                    updateSunCounter();

                    // IMPORTANTE: Deseleccionar planta correctamente
                    document.querySelectorAll('.plant-card').forEach(c => c.classList.remove('selected'));
                    GameState.selectedPlant = null;
                    GameState.selectedCost = 0;
                    
                    console.log('Planta colocada. Listo para nueva selección.');
                });
            }
        });

        // Componente para los soles clickeables
        AFRAME.registerComponent('sun-collectable', {
            init: function() {
                this.el.addEventListener('click', (evt) => {
                    evt.stopPropagation();
                    collectSun(this.el);

        // SISTEMA DE JUEGO
        // ========================================

        const GameState = {
            sunPoints: 50,
            selectedPlant: null,
            selectedCost: 0,
            plantedTiles: {},
            sunflowers: []
        };

        // ========================================
        // PLANTILLAS DE PLANTAS
        // ========================================

        const PlantTemplates = {
            sunflower: `
                <a-entity class="plant" data-type="sunflower">
                    <a-entity id="cabeza" position="0 1 0">
                        <a-sphere radius="0.4" color="#8B5A2B" shadow="cast: true"></a-sphere>

                        <a-sphere position="0.25 0.43 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="0.43 0.25 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="0.5 0 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="0.43 -0.25 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="0.25 -0.43 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="0 -0.5 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="-0.25 -0.43 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="-0.43 -0.25 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="-0.5 0 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="-0.43 0.25 0" radius="0.18" color="#F0C050"></a-sphere>
                        <a-sphere position="-0.25 0.43 0" radius="0.18" color="#F0C050"></a-sphere>
                        
                        <a-entity position="-0.12 0.08 0.35">
                            <a-sphere radius="0.1" color="#FFFFFF"></a-sphere>
                            <a-sphere position="0 0 0.08" radius="0.05" color="#000000"></a-sphere>
                        </a-entity>
                        <a-entity position="0.12 0.08 0.35">
                            <a-sphere radius="0.1" color="#FFFFFF"></a-sphere>
                            <a-sphere position="0 0 0.08" radius="0.05" color="#000000"></a-sphere>
                        </a-entity>
                        
                        <a-torus position="0 -0.15 0.38" radius="0.06" radius-tubular="0.012" rotation="180 0 0" arc="100" color="#000000"></a-torus>
                        <a-torus position="0 -0.15 0.38" radius="0.06" radius-tubular="0.012" rotation="180 180 0" arc="100" color="#000000"></a-torus>
                        
                        <a-sphere position="-0.25 -0.05 0.3" radius="0.06" color="#FFB6C1" opacity="0.7"></a-sphere>
                        <a-sphere position="0.25 -0.05 0.3" radius="0.06" color="#FFB6C1" opacity="0.7"></a-sphere>
                    </a-entity>
                    
                    <a-cylinder position="0 0.5 0" radius="0.08" height="1" color="#6B9E3E" shadow="cast: true"></a-cylinder>
                    
                    <a-entity position="-0.2 0.15 0" rotation="0 0 -50">
                        <a-sphere radius="0.2" color="#6B9E3E" scale="2 1 0.3"></a-sphere>
                    </a-entity>
                    <a-entity position="0.2 0.15 0" rotation="0 0 50">
                        <a-sphere radius="0.2" color="#6B9E3E" scale="2 1 0.3"></a-sphere>
                    </a-entity>
                </a-entity>
            `,
            
            peashooter: `
                <a-entity class="plant" data-type="peashooter" scale="0.8 0.8 0.8">
                    <a-entity id="cabeza" position="0 1 0">
                        <a-sphere radius="0.5" color="#A4D65E" shadow="cast: true"></a-sphere>
                        <a-cylinder position="0 0 0.58" radius="0.2" height="0.2" rotation="90 0 0" color="#6B9E3E"></a-cylinder>
                        <a-torus position="0 0 0.69" radius="0.2" radius-tubular="0.04" color="#507A2E"></a-torus>
                        <a-circle position="0 0 0.71" radius="0.17" color="#2A4019"></a-circle>
                        <a-torus position="0 0 0.7" radius="0.11" radius-tubular="0.02" color="#1A2A10"></a-torus>
                        <a-sphere position="-0.45 0 0.2" radius="0.04" color="#000000"></a-sphere>
                        <a-sphere position="0.45 0 0.2" radius="0.04" color="#000000"></a-sphere>
                        
                        <a-entity position="0 0.5 -0.1" rotation="0 0 -20">
                            <a-cone radius-bottom="0.15" radius-top="0.02" height="0.4" color="#6B9E3E"></a-cone>
                        </a-entity>
                        <a-entity position="0 0.5 -0.08" rotation="0 0 -20">
                            <a-cylinder radius="0.01" height="0.35" color="#507A2E"></a-cylinder>
                        </a-entity>
                        <a-cylinder position="0 0.15 -0.45" radius="0.05" height="0.2" color="#6B9E3E" rotation="-25 0 0"></a-cylinder>
                    </a-entity>
                    
                    <a-cylinder position="0 0.5 0" radius="0.08" height="1" color="#6B9E3E" shadow="cast: true"></a-cylinder>
                    
                    <a-entity position="-0.2 0.15 0" rotation="0 0 -50">
                        <a-sphere radius="0.2" color="#6B9E3E" scale="2 1 0.3"></a-sphere>
                    </a-entity>
                    <a-entity position="0.2 0.15 0" rotation="0 0 50">
                        <a-sphere radius="0.2" color="#6B9E3E" scale="2 1 0.3"></a-sphere>
                    </a-entity>
                </a-entity>
            `,
            
            wallnut: `
                <a-entity class="plant" data-type="wallnut" position="0 0.6 0" scale="0.6 0.6 0.6">
                    <a-sphere radius="1" scale="1 1.1 0.95" color="#B8924F" shadow="cast: true"></a-sphere>
                    
                    <a-entity position="-0.3 0.2 0.85">
                        <a-sphere radius="0.25" color="#FFFFFF"></a-sphere>
                        <a-sphere position="0 0 0.2" radius="0.09" color="#000000"></a-sphere>
                    </a-entity>
                    <a-entity position="0.3 0.2 0.85">
                        <a-sphere radius="0.25" color="#FFFFFF"></a-sphere>
                        <a-sphere position="0 0 0.2" radius="0.09" color="#000000"></a-sphere>
                    </a-entity>
                    
                    <a-box position="-0.3 0.5 0.8" width="0.3" height="0.05" depth="0.05" color="#654321" rotation="0 0 -10"></a-box>
                    <a-box position="0.3 0.5 0.8" width="0.3" height="0.05" depth="0.05" color="#654321" rotation="0 0 10"></a-box>
                    
                    <a-entity position="0 -0.25 0.92">
                        <a-torus radius="0.18" radius-tubular="0.025" color="#000000" arc="100" rotation="180 0 0"></a-torus>

                </a-entity>

        };

        // ========================================
        // ACTUALIZAR UI
        // ========================================

        function updateSunCounter() {
            document.getElementById('sun-amount').textContent = GameState.sunPoints;
            updatePlantCards();
        }

        function updatePlantCards() {
            const cards = document.querySelectorAll('.plant-card');
            cards.forEach(card => {
                const cost = parseInt(card.dataset.cost);
                if (GameState.sunPoints < cost) {
                    card.classList.add('disabled');
                } else {
                    card.classList.remove('disabled');
                }
            });
        }

        // ========================================
        // SELECCIÓN DE PLANTAS
        // ========================================

        document.querySelectorAll('.plant-card').forEach(card => {
            card.addEventListener('click', () => {
                const cost = parseInt(card.dataset.cost);
                
                if (GameState.sunPoints < cost) {
                    console.log('No tienes suficientes soles');
                    return;
                }

                // Deseleccionar todas las cartas
                document.querySelectorAll('.plant-card').forEach(c => c.classList.remove('selected'));
                
                // Seleccionar esta carta
                card.classList.add('selected');
                GameState.selectedPlant = card.dataset.plant;
                GameState.selectedCost = cost;

                console.log(`Planta seleccionada: ${GameState.selectedPlant} (Costo: ${cost})`);
            });
        });

        // ========================================
        // PLANTACIÓN
        // ========================================

        function plantPlant(tile, plantType, tileKey) {
            const position = tile.getAttribute('position');
            const container = document.getElementById('plants-container');
            
            const plantEntity = document.createElement('a-entity');
            plantEntity.setAttribute('position', `${position.x} ${position.y} ${position.z}`);
            plantEntity.setAttribute('rotation', '0 180 0');
            plantEntity.innerHTML = PlantTemplates[plantType];
            
            container.appendChild(plantEntity);
            
            GameState.plantedTiles[tileKey] = {
                type: plantType,
                entity: plantEntity
            };

            console.log(`¡Planta ${plantType} plantada en ${tileKey}!`);

            if (plantType === 'sunflower') {
                startSunflowerProduction(plantEntity, position);
            }
        }

        // ========================================
        // SISTEMA DE SOLES
        // ========================================

        function startSunflowerProduction(plantEntity, position) {
            const sunflowerData = {
                entity: plantEntity,
                position: position,
                lastSunTime: Date.now()
            };

            GameState.sunflowers.push(sunflowerData);
        }

        setInterval(() => {
            GameState.sunflowers.forEach(sunflower => {
                const now = Date.now();
                if (now - sunflower.lastSunTime >= 15000) {
                    spawnSun(sunflower.position);
                    sunflower.lastSunTime = now;
                }
            });
        }, 1000);

        function spawnSun(position) {
            const container = document.getElementById('suns-container');
            const sun = document.createElement('a-entity');
            
            const sunX = position.x;
            const sunY = position.y + 2;
            const sunZ = position.z;

            sun.setAttribute('position', `${sunX} ${sunY} ${sunZ}`);
            sun.setAttribute('class', 'clickable');
            sun.setAttribute('sun-collectable', '');
            
            sun.innerHTML = `
                <a-sphere 
                    radius="0.3" 
                    color="#FFD700"
                    material="emissive: #FFD700; emissiveIntensity: 0.8"
                    shadow="cast: true"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
                </a-sphere>
                <a-sphere 
                    radius="0.25" 
                    color="#FFA500"
                    material="emissive: #FFA500; emissiveIntensity: 0.6">
                </a-sphere>
            `;

            sun.setAttribute('animation__fall', {
                property: 'position',
                to: `${sunX} ${position.y + 0.5} ${sunZ}`,
                dur: 1500,
                easing: 'easeOutQuad'
            });

            setTimeout(() => {
                sun.setAttribute('animation__float', {
                    property: 'position',
                    from: `${sunX} ${position.y + 0.5} ${sunZ}`,
                    to: `${sunX} ${position.y + 0.7} ${sunZ}`,
                    dur: 1000,
                    dir: 'alternate',
                    loop: true,
                    easing: 'easeInOutSine'
                });
            }, 1500);

            container.appendChild(sun);

            setTimeout(() => {
                if (sun.parentNode) {
                    sun.parentNode.removeChild(sun);
                }
            }, 10000);
        }

        function collectSun(sunElement) {
            if (!sunElement || !sunElement.parentNode) {
                return;
            }

            // +50 SOLES
            GameState.sunPoints += 50;
            updateSunCounter();

            sunElement.setAttribute('animation__collect', {
                property: 'position.y',
                to: 10,
                dur: 500,
                easing: 'easeInQuad'
            });
            sunElement.setAttribute('animation__fade', {
                property: 'scale',
                to: '0 0 0',
                dur: 500,
                easing: 'easeInQuad'
            });

            setTimeout(() => {
                if (sunElement.parentNode) {
                    sunElement.parentNode.removeChild(sunElement);
                }
            }, 500);

            console.log('¡Sol recogido! +50 soles. Total: ' + GameState.sunPoints);
        }

        // ========================================
        // INICIALIZACIÓN
        // ========================================

        document.querySelector('a-scene').addEventListener('loaded', function () {
            const tiles = document.querySelectorAll('.plant-tile');
            tiles.forEach(tile => {
                tile.setAttribute('plant-tile', '');
            });

            updateSunCounter();
            console.log('¡Juego iniciado! Soles: ' + GameState.sunPoints);
            
            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        const randomX = Math.random() * 4 - 2;
                        const randomZ = -2 - Math.random() * 15;
                        spawnSun({ x: randomX, y: 0, z: randomZ });
                    }, i * 2000);
                }
            }, 5000);
        });
    </script>        
</body>
</html>
